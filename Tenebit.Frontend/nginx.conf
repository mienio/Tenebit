limit_req_zone $binary_remote_addr zone=tenebit_api_per_ip:10m rate=100r/s;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/problem+json application/javascript text/css text/plain text/xml image/svg+xml;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40M;
    server_tokens off;
    # Capability/reset/verification secrets must never enter reverse-proxy request logs.
    access_log off;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 restricted to AEAD suites (GCM/CHACHA20-POLY1305) - no CBC. TLS 1.3 ciphers are
    # negotiated separately by OpenSSL and are always AEAD, so they are unaffected by this list.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # Single source of truth for security headers (see security-headers.conf). nginx's add_header
    # does NOT inherit into a location that declares its own add_header, so every location below that
    # sets one (Cache-Control, X-Content-Type-Options) must re-include this snippet explicitly -
    # otherwise it silently drops CSP/HSTS/frame-ancestors/etc. for that location only.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location ~* ^/assets/.+\.[A-Za-z0-9]+$ { include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; expires 1y; add_header Cache-Control "public,max-age=31536000,immutable"; }
    location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store"; try_files $uri =404; }
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        limit_req zone=tenebit_api_per_ip burst=200 nodelay;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
        proxy_hide_header Server;
    }
    location / { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store"; try_files $uri $uri/ /index.html; }
}
