# teneb.it is served through Cloudflare (proxied DNS), so the peer nginx sees is always a Cloudflare edge,
# never the visitor. Without this, $remote_addr is a Cloudflare address for every single request, and
# everything keyed on the client IP silently degrades: nginx's own limit_req zone becomes one shared bucket
# for the whole internet, the per-IP rate limiters and the sign-in abuse limiter in the backend lose their
# partitioning, audit logs record Cloudflare instead of the user, and the Paddle webhook IP allowlist
# rejects every genuine delivery - which is how this was found.
#
# real_ip_header is only honoured for connections coming FROM the ranges below, so CF-Connecting-IP cannot
# be forged by someone reaching the origin directly. real_ip_recursive is off because CF-Connecting-IP
# already holds a single address, not a chain.
#
# Ranges fetched from https://www.cloudflare.com/ips-v4 and /ips-v6 on 2026-09-23. They change rarely but
# they do change - refresh with scripts/refresh-cloudflare-ips.sh and redeploy.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive off;
