# Shared security-header set, included from every location block in nginx.conf that defines its
# own add_header (nginx only inherits add_header from the parent block when the child location has
# none of its own - see nginx.conf for details). Keep this the single source of truth.
# frame-src/script-src/connect-src/style-src/font-src/img-src additions for Paddle.js (see paddle_plan.md
# section 6) - Paddle doesn't publish a closed list of the domains its overlay checkout talks to, so these
# were picked from its documented CDN/checkout hosts and re-verified against real browser console CSP
# violations from an actual sandbox checkout open (2026-09-08: style-src was missing both cdn.paddle.com
# and sandbox-cdn.paddle.com entirely - Paddle.js injects a <link rel="stylesheet"> for the overlay chrome
# straight into the parent document, not just inside its checkout.paddle.com iframe, so it needs style-src
# too, not only frame-src/script-src - the blocked stylesheet load rendered the whole overlay blank/broken
# and threw a JS error that crashed the React app's error boundary). font-src/img-src get the same two
# hosts pre-emptively since the overlay is very likely to pull a webfont/icon from the same CDN next -
# loosen further only what's actually flagged in the console, same rule as before.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.paddle.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com https://sandbox-cdn.paddle.com; font-src 'self' data: https://cdn.paddle.com https://sandbox-cdn.paddle.com; img-src 'self' data: blob: https://cdn.paddle.com https://sandbox-cdn.paddle.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://cdn.paddle.com https://sandbox-cdn.paddle.com https://checkout-service.paddle.com https://sandbox-checkout-service.paddle.com; frame-src 'self' https://buy.paddle.com https://sandbox-buy.paddle.com https://checkout.paddle.com; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
