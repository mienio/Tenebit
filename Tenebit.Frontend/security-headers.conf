# Shared security-header set, included from every location block in nginx.conf that defines its
# own add_header (nginx only inherits add_header from the parent block when the child location has
# none of its own - see nginx.conf for details). Keep this the single source of truth.
# frame-src/script-src/connect-src/style-src/font-src/img-src additions for Paddle.js (see paddle_plan.md
# section 6) - Paddle doesn't publish a closed list of the domains its overlay checkout talks to, so these
# were picked from its documented CDN/checkout hosts and re-verified against real browser console CSP
# violations from an actual checkout open (2026-09-08: style-src was missing cdn.paddle.com entirely -
# Paddle.js injects a <link rel="stylesheet"> for the overlay chrome straight into the parent document,
# not just inside its checkout.paddle.com iframe, so it needs style-src too, not only frame-src/script-src
# - the blocked stylesheet load rendered the whole overlay blank/broken and threw a JS error that crashed
# the React app's error boundary). font-src/img-src get the same host pre-emptively since the overlay is
# very likely to pull a webfont/icon from the same CDN next - loosen further only what's actually flagged
# in the console, same rule as before.
#
# Production hosts only. The sandbox-*.paddle.com counterparts were dropped when billing moved to the live
# Paddle account (2026-09-22) - Paddle.js on production never resolves them, so listing them only widened
# the policy for nothing. Anyone pointing Paddle:Environment back at sandbox has to put them back, or the
# overlay breaks exactly the way the 2026-09-08 entry above describes.
#
# challenges.cloudflare.com additions are for the Turnstile ("I'm not a robot") widget on the register
# forms: it loads its script from there and renders the checkbox itself inside an iframe from the same
# host, so both script-src and frame-src need it or the widget silently fails to render (same class of
# bug as the Paddle CSP miss above - learn from it, add both up front instead of one-by-one from console).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.paddle.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.paddle.com; font-src 'self' data: https://cdn.paddle.com; img-src 'self' data: blob: https://cdn.paddle.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://cdn.paddle.com https://checkout-service.paddle.com https://challenges.cloudflare.com; frame-src 'self' https://buy.paddle.com https://checkout.paddle.com https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# payment= has to delegate to Paddle's overlay frame, not stay empty. Paddle.js creates its checkout
# iframe with allow="payment" (verified in cdn.paddle.com/paddle/v2/paddle.js: window.PaddleFrame.allow
# = "payment"), and an allow attribute can only hand down a permission the parent document actually
# holds for that origin. With payment=() the delegation is refused and the Payment Request API is dead
# inside the overlay, which is what Apple Pay and Google Pay are built on - card entry still works, so
# this fails quietly as "the express buttons never show up" rather than as a visible error. The origin
# is buy.paddle.com because that is Paddle.js's production checkoutFrontEndBase (same file); everything
# else stays denied, and our own origin has no use for the API.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(\"https://buy.paddle.com\"), usb=(), serial=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
