name: tenebit
x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__TenebitDb: Host=db;Port=5432;Database=tenebit;Username=tenebit;Password=${TENEBIT_DB_PASSWORD:?required}
  Auth__SigningKey: ${TENEBIT_SIGNING_KEY:?required}
  Auth__FieldEncryption__ActiveKeyId: primary
  Auth__FieldEncryption__LegacyV1KeyId: primary
  Auth__FieldEncryption__AllowLegacyPlaintext: "false"
  Auth__FieldEncryption__Keys__primary: ${TENEBIT_FIELD_ENCRYPTION_KEY:?required}
  App__PublicUrl: ${TENEBIT_PUBLIC_URL:?required}
  AllowedHosts: ${TENEBIT_ALLOWED_HOSTS:?required}
  Cors__AllowedOrigins__0: ${TENEBIT_PUBLIC_URL:?required}
  ReverseProxy__KnownProxies__0: 172.30.0.10
  Database__AutoCreate: "false"
  Seed__Enabled: "false"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenebit
      POSTGRES_USER: tenebit
      POSTGRES_PASSWORD: ${TENEBIT_DB_PASSWORD:?required}
    volumes: [tenebit-db:/var/lib/postgresql/data]
    networks: { internal: { ipv4_address: 172.30.0.20 } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tenebit -d tenebit"], interval: 10s, timeout: 5s, retries: 10 }
    security_opt: ["no-new-privileges:true"]
  migrator:
    build: { context: ./Tenebit.Backend }
    image: tenebit-backend:${TENEBIT_IMAGE_TAG:-local}
    command: ["dotnet", "Tenebit.Api.dll", "--migrate-only"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp:size=128m,mode=1777]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *backend-env
    depends_on: { db: { condition: service_healthy } }
    networks: { internal: { ipv4_address: 172.30.0.30 } }
  backend:
    image: tenebit-backend:${TENEBIT_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=256m,mode=1777]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *backend-env
    depends_on: { migrator: { condition: service_completed_successfully } }
    networks: { internal: { ipv4_address: 172.30.0.40 } }
  frontend:
    build: { context: ./Tenebit.Frontend }
    image: tenebit-frontend:${TENEBIT_IMAGE_TAG:-local}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=64m,mode=1777, /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports: ["127.0.0.1:${TENEBIT_HTTP_PORT:-8080}:8080"]
    depends_on: { backend: { condition: service_healthy } }
    networks: { internal: { ipv4_address: 172.30.0.10 } }
volumes: { tenebit-db: {} }
networks:
  internal:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
