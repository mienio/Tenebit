name: tenebit
x-backend-env: &backend-env
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__TenebitDb: Host=db;Port=5432;Database=tenebit;Username=tenebit;Password=${TENEBIT_DB_PASSWORD:?required}
  Auth__SigningKey: ${TENEBIT_SIGNING_KEY:?required}
  Auth__FieldEncryption__ActiveKeyId: primary
  Auth__FieldEncryption__LegacyV1KeyId: primary
  Auth__FieldEncryption__AllowLegacyPlaintext: "false"
  Auth__FieldEncryption__Keys__primary: ${TENEBIT_FIELD_ENCRYPTION_KEY:?required}
  App__PublicUrl: ${TENEBIT_PUBLIC_URL:?required}
  AllowedHosts: ${TENEBIT_ALLOWED_HOSTS:?required}
  Cors__AllowedOrigins__0: ${TENEBIT_PUBLIC_URL:?required}
  ReverseProxy__KnownProxies__0: 172.30.0.10
  Database__AutoCreate: "false"
  Seed__Enabled: "true"
  Seed__DemoData: "true"
  Seed__DemoAccountEmail: ${TENEBIT_DEMO_EMAIL:-demo@teneb.it}
  Seed__DemoAccountPassword: ${TENEBIT_DEMO_PASSWORD:?required}
  Email__Enabled: "true"
  Email__OutboxDispatcherEnabled: "true"
  Email__Host: ${TENEBIT_SMTP_HOST:?required}
  Email__Port: ${TENEBIT_SMTP_PORT:-587}
  Email__Username: ${TENEBIT_SMTP_USERNAME:-}
  Email__Password: ${TENEBIT_SMTP_PASSWORD:-}
  Email__FromAddress: ${TENEBIT_SMTP_FROM:?required}
  Email__FromName: ${TENEBIT_SMTP_FROM_NAME:-Tenebit}
  Email__UseSsl: ${TENEBIT_SMTP_USE_SSL:-true}
  Stripe__SecretKey: ${TENEBIT_STRIPE_SECRET_KEY:-}
  Stripe__WebhookSecret: ${TENEBIT_STRIPE_WEBHOOK_SECRET:-}
  Stripe__Prices__starter: ${TENEBIT_STRIPE_PRICE_STARTER:-}
  Stripe__Prices__growth: ${TENEBIT_STRIPE_PRICE_GROWTH:-}
  Stripe__Prices__business: ${TENEBIT_STRIPE_PRICE_BUSINESS:-}
  Stripe__Prices__enterprise: ${TENEBIT_STRIPE_PRICE_ENTERPRISE:-}
services:
  db:
    image: postgres:17-alpine
    container_name: tenebit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tenebit
      POSTGRES_USER: tenebit
      POSTGRES_PASSWORD: ${TENEBIT_DB_PASSWORD:?required}
    volumes: [tenebit-db-data:/var/lib/postgresql/data]
    networks: { internal: { ipv4_address: 172.30.0.20 } }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tenebit -d tenebit"], interval: 10s, timeout: 5s, retries: 10 }
    security_opt: ["no-new-privileges:true"]
  migrator:
    build: { context: ./Tenebit.Backend }
    image: tenebit-backend:${TENEBIT_IMAGE_TAG:-local}
    command: ["dotnet", "Tenebit.Api.dll", "--migrate-only"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment: *backend-env
    depends_on: { db: { condition: service_healthy } }
    networks: { internal: { ipv4_address: 172.30.0.30 } }
  backend:
    image: tenebit-backend:${TENEBIT_IMAGE_TAG:-local}
    container_name: tenebit-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *backend-env
      Admin__Email: ${TENEBIT_ADMIN_EMAIL:?required}
      Admin__PasswordHash: ${TENEBIT_ADMIN_PASSWORD_HASH:?required}
      Admin__TotpSecret: ${TENEBIT_ADMIN_TOTP_SECRET:?required}
    depends_on: { migrator: { condition: service_completed_successfully } }
    networks: { internal: { ipv4_address: 172.30.0.40 } }
  frontend:
    build: { context: ./Tenebit.Frontend }
    image: tenebit-frontend:${TENEBIT_IMAGE_TAG:-local}
    container_name: tenebit-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=32m,mode=0755,uid=101,gid=101
      - /var/run:size=4m,mode=0755,uid=101,gid=101
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./certbot-www:/var/www/certbot:ro
      - ./certs/teneb.it:/etc/nginx/certs:ro
    depends_on: { backend: { condition: service_healthy } }
    networks: { internal: { ipv4_address: 172.30.0.10 } }
volumes: { tenebit-db-data: {} }
networks:
  internal:
    driver: bridge
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
